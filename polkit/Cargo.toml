[package]
name = "nuxut-polkit"
description = "Nuxut polkit kimlik doğrulama ajanı (yerleşik ajan + istek başına diyalog süreci)."
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
# YALNIZCA test: sahte bus (NUXUT_POLKIT_FAKE_BUS), sahte yardımcı soketi, başsız diyalog ve
# sahte yardımcı ikilisi. Sürüm derlemesinde compile_error (main.rs); paketlenen ikili bu
# özelliği hiç açmaz (lock `fake-auth` kalıbı).
fake-polkit = []

[[bin]]
name = "nuxut-polkit"
path = "src/main.rs"

# Sahte polkit yardımcısı (yalnızca testler): soket üzerinden yardımcı protokolünü konuşur,
# sabit parolayı bekler, başarıda sahte Authority'ye AuthenticationAgentResponse2 gönderir.
[[bin]]
name = "nuxut-polkit-fake-helper"
path = "src/bin/fake_helper.rs"
required-features = ["fake-polkit"]

[[test]]
name = "e2e_fake"
required-features = ["fake-polkit"]

[dependencies]
# Parola tamponu (mlock + sıfırlama), PR_SET_DUMPABLE, getpwuid_r. Kilitle aynı crate; unsafe orada.
nuxut-pam = { version = "0.2.0-alpha.1", path = "../crates/nuxut-pam" }
nuxut = { version = "0.2.0-alpha.1", path = "../../framework/crates/nuxut" }
# polkitd ve logind (shell/lock ile aynı; varsayılan async-io yürütücüsü).
zbus = "5.16"
async-channel = "2"
async-io = "2"
futures-lite = "2"
# Ajan ↔ diyalog sözleşmesi (tek satır JSON; ağaçta var).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# shell.toml [polkit] tablosu (shell ile aynı sürüm).
toml = "1"
# kill(2), PR_SET_PDEATHSIG, pidfd_open, CLOCK_BOOTTIME güvenli sarmalayıcıları (ağaçta var; unsafe_code = forbid).
rustix = { version = "1.1", features = ["process", "time", "param", "event"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
