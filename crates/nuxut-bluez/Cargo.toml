[package]
name = "nuxut-bluez"
description = "Nuxut BlueZ istemcisi: adaptörler, cihazlar, eylemler, eşleştirme ajanı. UI'sız (i18n yok; hatalar tür olarak)."
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = true

[dependencies]
nuxut-dbus = { version = "0.2.0-alpha.1", path = "../nuxut-dbus" }
zbus = "5.16"
async-channel = "2"
async-io = "2"
futures-lite = "2"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# Yalnız testler ve sahte servisler: bus_from_env / BUS_ENV ve examples/. Ürün derlemesinde yok;
# kabuğun (ve Ayarlar'ın) dev-dependency'sinde açılır.
test-support = ["nuxut-dbus/test-support"]

[[example]]
name = "fake_bluez"
required-features = ["test-support"]

[[example]]
name = "bt_probe"
required-features = ["test-support"]
