[package]
name = "nuxut-power"
description = "Nuxut güç istemcisi: UPower (pil, AC, pil şarj sınırı) ve power-profiles-daemon (profil). UI'sız (i18n yok; hatalar tür olarak)."
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = true

[dependencies]
nuxut-dbus = { version = "0.2.0-alpha.1", path = "../nuxut-dbus" }
zbus = "5.16"
async-channel = "2"
futures-lite = "2"
serde_json = "1"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# Yalnız testler: bus_from_env / BUS_ENV. Ürün derlemesinde yok; kabuğun ve Ayarlar'ın
# dev-dependency'sinde açılır.
test-support = ["nuxut-dbus/test-support"]
