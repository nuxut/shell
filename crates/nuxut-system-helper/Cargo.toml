[package]
name = "nuxut-system-helper"
description = "Nuxut kök yetkili sistem yardımcısı (pkexec ile, eylem başına polkit kimliği). Yalnız beyaz listedeki yollara yazar; her değişikliği yedekler ve geri alır. ADR-0008."
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuxut-system-helper"
path = "src/main.rs"

[features]
# YALNIZCA test: kök yerine geçici bir dizin (NUXUT_HELPER_TEST_ROOT), beklenen sahip çağıranın
# uid'i, dış komutlar NUXUT_HELPER_TEST_BIN'den. Sürüm derlemesinde compile_error (main.rs);
# paketlenen ikili bu özelliği hiç açmaz (nuxut-polkit `fake-polkit` kalıbı).
test-root = []

[dependencies]
nuxut-boot-theme = { version = "0.2.0-alpha.1", path = "../nuxut-boot-theme" }
# openat/O_NOFOLLOW/renameat/fstat/flock/statvfs: doğrulanmış dizin tanıtıcılarıyla dosya işlemleri
# (sembolik bağ ve TOCTOU savunması). Ağaçta var; unsafe_code = forbid.
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Giriş ekranı alanı: kullanıcının görünüm dosyalarını doğrulayıp yayımlamak (ağaçta var).
toml = "1"
# Bildirim (manifest) içerik özeti: yazdığımız dosya geri almadan önce değişmiş mi (ağaçta var).
blake3 = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "e2e"
required-features = ["test-root"]
