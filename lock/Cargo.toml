[package]
name = "nuxut-lock"
description = "Nuxut kilit ekranı (ext-session-lock-v1 + PAM)."
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
# YALNIZCA canlı test: NUXUT_LOCK_FAKE_SECRET ile sahte doğrulayıcı. Sürüm derlemesinde
# compile_error (main.rs); paketlenen ikili bu özelliği hiç açmaz.
fake-auth = []

[[bin]]
name = "nuxut-lock"
path = "src/main.rs"

[dependencies]
nuxut-pam = { version = "0.2.0-alpha.1", path = "../crates/nuxut-pam" }
# lock.toml (shell ile aynı sürümler; ek derleme maliyeti yok).
toml = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# a11y: kilit ekranı ekran okuyucuya açık (ADR-0011 madde 8; AT yalnız okur). at-spi yoksa adaptör yok.
nuxut = { version = "0.2.0-alpha.1", path = "../../framework/crates/nuxut", features = ["a11y"] }
# Duvar kağıdı (render özelliğiyle Wallpaper); jxl gerekmez.
nuxut-image = { version = "0.2.0-alpha.1", path = "../../framework/crates/nuxut-image", default-features = false, features = ["render"] }
# Duvar kağıdı ve avatar yalıtılmış işçide, duvar kağıdı profiliyle (ADR-0007 takip; shell ile aynı
# crate, işçi ikilisi `nuxut-image-worker` ayrı paket).
nuxut-image-sandbox = { version = "0.2.0-alpha.1", path = "../../framework/crates/nuxut-image-sandbox" }
# Yerleşik duvar kağıtları: shell ile aynı kaynak (`nuxut:<id>`), aynı render önbelleği.
nuxut-wallpapers = { version = "0.2.0-alpha.1", path = "../crates/nuxut-wallpapers", features = ["frame"] }
# fprintd ve logind (shell ile aynı; varsayılan async-io yürütücüsü, ek çalışma zamanı yok).
zbus = "5.16"
async-channel = "2"
async-io = "2"
futures-lite = "2"

[dev-dependencies]
nuxut-pam = { path = "../crates/nuxut-pam", features = ["testing"] }
tempfile = "3"

[lints.rust]
# unsafe yalnızca nuxut-pam'de.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
